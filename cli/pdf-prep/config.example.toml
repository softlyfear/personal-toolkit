# Copy to config.toml next to this file. config.toml is gitignored.
# Resolution order for every value below: CLI flag > PDFPREP_* environment variable
# > this file > built-in default.

[paths]
# Defaults are task/ and result/ inside the project directory.
# task_dir = "/home/me/pdfs-in"
# result_dir = "/home/me/pdfs-out"

[split]
max_part_mb = 30
max_part_pages = 100

[compress]
# One mode: lossless restructuring, then rasters above target_dpi are downsampled at
# jpeg_quality. The lossless result is the floor — a lossy output that is larger, or that
# fails the acceptance checks, is discarded.
target_dpi = 200
jpeg_quality = 85
# Pages rendered per file when verifying compression. 0 = every page.
verify_sample_pages = 12
verify_dpi = 150

[ocr]
# Applied only to pages without a readable text layer.
enabled = true
languages = ["en", "ru"]
# auto — the GPU when torch sees one with room for the models, else the CPU
# gpu  — same, but warn when it falls back; cpu — never touch the GPU
# Which GPU builds are available is decided by install.sh; see `pdf-prep doctor`.
device = "auto"

[llm]
# claude-cli       — the `claude` CLI on your Claude subscription (default, no API key)
# anthropic-api    — Anthropic API, key from ANTHROPIC_API_KEY
# openai-compatible — OpenAI or any API-compatible endpoint, key from OPENAI_API_KEY
provider = "claude-cli"
model = "sonnet"
max_tokens = 8000
timeout_s = 600
# Characters of source text per translation request.
chunk_chars = 6000

